name: windows-package

on:
  push:
  workflow_dispatch:

jobs:
  base-package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: PyInstaller onedir
        run: pyinstaller --noconfirm --clean archivedesk.spec
      - name: Stage the template-free base zip
        run: python tools/stage_windows_dist.py --dist dist/ArchiveDesk --zip dist/ArchiveDesk-base.zip
      - name: Check bundled recognition models
        shell: pwsh
        run: |
          $exe = ".\dist\ArchiveDesk\ArchiveDesk.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--check" -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(120000)) {
            Stop-Process -Id $proc.Id -Force
            throw "ArchiveDesk.exe --check did not exit within 120 seconds"
          }
          if ($proc.ExitCode -ne 0) { throw "ArchiveDesk.exe --check exited $($proc.ExitCode)" }
      - name: Upload base zip
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveDesk-base
          path: |
            dist/ArchiveDesk-base.zip
            dist/package-report.txt
          if-no-files-found: error

  smoke:
    needs: base-package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: ArchiveDesk-base
          path: dist
      - name: Headless 10-PDF smoke
        run: python tools/smoke_batch.py --report dist/smoke-report.json --zip dist/ArchiveDesk-base.zip
      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: dist/smoke-report.json
          if-no-files-found: error

  installer:
    needs: base-package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ArchiveDesk-base
          path: dist
      - name: Unpack the base package
        shell: pwsh
        run: |
          Expand-Archive -Path dist/ArchiveDesk-base.zip -DestinationPath dist/unpacked -Force
          if (Test-Path dist/unpacked/ArchiveDesk/templates/standard_template.xlsx) {
            throw "base package must not contain the standard template"
          }
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile setup.exe
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "packaging\ArchiveDesk.iss" "/DDistDir=$PWD\dist\unpacked\ArchiveDesk" "/DOutputDir=$PWD\dist"
          $setup = Get-Item dist\ArchiveDesk-setup.exe
          "setup_bytes=$($setup.Length)" | Tee-Object dist\setup-report.txt
      - name: Upload setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveDesk-setup
          path: |
            dist/ArchiveDesk-setup.exe
            dist/setup-report.txt
          if-no-files-found: error
